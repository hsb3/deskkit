name: ci

# The repo's build/graduation gate. One aggregate job (`ci`) runs both product lanes — the
# plugin (harness-pure core, MCP surface, schemas) and the librarian (Go binary) — plus the
# D8 identity-neutrality lint (M-05 surface iii), which fails the build on any hardcoded
# deployment identity. The single job name keeps one check to mark required at phase end.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # full history + tags so the version-status advisory can diff since the last release

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: librarian/go.mod
          cache-dependency-path: librarian/go.sum

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'

      # ---- neutrality lint (D8) — runs first: fastest signal, no build needed ----
      - name: Neutrality lint — scan the shipped tree
        run: node scripts/check-neutrality.mjs

      - name: Neutrality lint — self-test (seeded-violation detection, AC5 down)
        run: node scripts/check-neutrality.mjs --self-test

      # Version-sync: the root VERSION file is the single source of truth; fail if any of the
      # three shipped manifests (plugin.json, plugin/package.json, marketplace.json) drift.
      - name: Version-sync — VERSION vs shipped manifests
        run: node scripts/check-version-sync.mjs

      # Kit-manifest drift: the root kits.yaml must agree with the kits/ tree in both directions
      # (0013 S4(a); ported per #49). Fails naming any missing/untracked kit dir or file.
      - name: Kit-manifest drift guard — kits.yaml vs kits/ tree
        run: node scripts/check-kits.mjs

      # Prompt-copy drift: the librarian system-prompt embed and its "kept verbatim" quote in the
      # v1 spec must stay byte-identical (ADR 0015 — git is truth). Fails naming where they diverge.
      - name: Prompt-copy drift guard — embed vs spec quote
        run: node scripts/check-prompt-drift.mjs

      # Tool-surface drift: docs/tool-surface.md's counts must match source (ADR 0016). The TS
      # server (4) and CLI (16 base) counts are pinned here; the gate-dependent Librarian MCP
      # counts (5/6/17/18, MCP_MODULES=pm → 12) are pinned by TestToolSurfaceDoc_MCPCounts on the
      # go-test lane below. Self-test proves the guard still fails on a tool add/remove.
      - name: Tool-surface drift guard — doc counts vs source
        run: node scripts/check-tool-surface.mjs

      - name: Tool-surface drift guard — self-test (seeded divergence detection)
        run: node scripts/check-tool-surface.mjs --self-test

      # TextField explicit-Max recurrence guard (ADR 0017 slice C): fails on any content TextField
      # under librarian collections that carries neither an inline Max, a migration cap, nor a
      # documented exemption — the drift class 0011/0013 opened. Self-test proves seeded detection.
      - name: TextField explicit-Max guard (+ self-test)
        run: |
          node scripts/check-textfield-max.mjs
          node scripts/check-textfield-max.mjs --self-test

      # Query-kind drift: the librarian `query` tool's fixed kind list must agree across the MCP
      # schema struct tag (types.go), the spec's §5.6 quote of it, and the runtime dispatch switch
      # in func Query (query.go). Self-test proves the guard still detects a seeded add/drop.
      - name: Query-kind drift guard (+ self-test)
        run: |
          node scripts/check-query-kinds.mjs
          node scripts/check-query-kinds.mjs --self-test

      # Profile-root drift: the canonical schema/paths.yaml value and both lanes' pinned constants
      # (plugin PROFILE_ROOT_DIR, librarian config.ProfileRootDir) must stay identical — a rename is
      # then a one-definition change. Self-test proves the guard still bites on a seeded divergence.
      - name: Profile-root drift guard (+ self-test)
        run: |
          node scripts/check-profile-root.mjs
          node scripts/check-profile-root.mjs --self-test

      # Advisory only (never fails the build): nudges when user-facing changes have piled up
      # under plugin/ or librarian/ since the last v* tag without a VERSION bump. The hard gate
      # (a documented CHANGELOG section for the tagged version) lives in release.yml.
      - name: Version-status advisory (non-blocking)
        run: node scripts/check-version-status.mjs

      # ---- repo-wide shell/workflow lint gates (mirror lefthook + `make check`, now enforced
      # server-side so a --no-verify push can't bypass them) ----

      # shellcheck: the shell entry points (public installer, the verify gate, the sandbox helpers,
      # the media recorder) were never linted in any workflow — a broken install.sh could ship. The
      # ubuntu-latest runner image ships shellcheck, so no install step is needed.
      - name: Shellcheck — shell entry points
        run: shellcheck install.sh librarian/verify.sh librarian/dogfood-agent.sh librarian/dogfood-pm.sh librarian/sandbox/*.sh scripts/record-media.sh

      # actionlint: previously pre-commit / `make check` only, so a bypassed push escaped it. Built
      # with the Go toolchain already set up above (no new third-party action to pin and maintain).
      - name: Actionlint — workflow lint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint"

      # SHA-pin drift: every `uses:` must stay pinned to a full 40-hex commit SHA — nothing else
      # stops a later PR reintroducing a mutable @vN tag. Self-test proves the guard still bites.
      - name: Workflow SHA-pin drift guard (+ self-test)
        run: |
          node scripts/check-workflow-pins.mjs
          node scripts/check-workflow-pins.mjs --self-test

      # ---- plugin lane ----
      - name: Install plugin deps
        working-directory: plugin
        run: bun install --frozen-lockfile

      - name: Plugin — core purity (AC2)
        working-directory: plugin
        run: bun run check:purity

      # Marketplace-distribution artifacts (plugins/desk-standard/mcp/server.js + schema copy)
      # are generated by `bun run package` and committed so a marketplace install — which copies
      # ONLY plugins/desk-standard/ to the plugin cache — carries a self-contained server. Fail
      # if the committed artifacts drift from a fresh regeneration (never hand-edit them).
      - name: Plugin — packaged artifacts drift guard
        working-directory: plugin
        run: |
          bun run package
          git diff --exit-code -- ../plugins/desk-standard/

      - name: Plugin — tests (incl. AC8 schema validation)
        working-directory: plugin
        run: bun run test

      - name: Plugin — TypeScript build
        working-directory: plugin
        run: bun run build

      # ---- librarian lane ----
      - name: Librarian — build
        working-directory: librarian
        run: go build ./...

      - name: Librarian — vet
        working-directory: librarian
        run: go vet ./...

      # gofmt formatting gate: fail if any file under librarian/ is not gofmt-clean. Uses the
      # librarian Makefile's `fmt` target (gofmt -l over the tree, fail-on-nonempty) so the gate
      # logic lives in one place; mirrors how `vet` above is a standing Go-lane check.
      - name: Librarian — gofmt (formatting gate)
        run: make -C librarian fmt

      - name: Librarian — tests
        working-directory: librarian
        run: go test ./...

      - name: Librarian — verify gate (integration; self-init, write-boundary, restore, open-guard)
        run: make verify
