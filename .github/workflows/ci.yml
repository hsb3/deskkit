name: ci

# The repo's build/graduation gate. One aggregate job (`ci`) runs the product lane — the
# deskkit Go module — plus the D8 identity-neutrality lint (M-05 surface iii), which fails
# the build on any hardcoded deployment identity. The single job name keeps one check to mark
# required at phase end.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history + tags so the version-status advisory can diff since the last release

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # ---- neutrality lint (D8) — runs first: fastest signal, no build needed ----
      - name: Neutrality lint — scan the shipped tree
        run: node scripts/check-neutrality.mjs

      - name: Neutrality lint — self-test (seeded-violation detection, AC5 down)
        run: node scripts/check-neutrality.mjs --self-test

      # Version-sync: the root VERSION file is the single source of truth; fail if any of the
      # shipped manifests (the bundle's plugin.json, marketplace.json) drift.
      - name: Version-sync — VERSION vs shipped manifests
        run: node scripts/check-version-sync.mjs

      # Kit-manifest drift: the root kits.yaml must agree with the kits/ tree in both directions
      # (0013 S4(a); ported per #49). Fails naming any missing/untracked kit dir or file.
      - name: Kit-manifest drift guard — kits.yaml vs kits/ tree
        run: node scripts/check-kits.mjs

      # Tool-surface drift (docs/development/specs/tool-surface.md's CLI + MCP counts vs source) is
      # guarded entirely on the go-test lane below — see internal/core/mcp/
      # tool_surface_doc_test.go. No workflow step here.

      # TextField explicit-Max recurrence guard (ADR 0017 slice C): fails on any content TextField
      # under librarian collections that carries neither an inline Max, a migration cap, nor a
      # documented exemption — the drift class 0011/0013 opened. Self-test proves seeded detection.
      - name: TextField explicit-Max guard (+ self-test)
        run: |
          node scripts/check-textfield-max.mjs
          node scripts/check-textfield-max.mjs --self-test

      # Query-kind drift: the librarian `query` tool's fixed kind list must agree across the MCP
      # schema struct tag (types.go), the spec's §5.6 quote of it, and the runtime dispatch switch
      # in func Query (query.go). Self-test proves the guard still detects a seeded add/drop.
      - name: Query-kind drift guard (+ self-test)
        run: |
          node scripts/check-query-kinds.mjs
          node scripts/check-query-kinds.mjs --self-test

      # Profile-root drift: the canonical schema/paths.yaml value and the librarian's pinned
      # constant (config.ProfileRootDir) must stay identical — a rename is then a one-definition
      # change. Self-test proves the guard still bites on a seeded divergence.
      - name: Profile-root drift guard (+ self-test)
        run: |
          node scripts/check-profile-root.mjs
          node scripts/check-profile-root.mjs --self-test

      # Doc-link integrity: every cited doc/media path on the published+shipped surface must resolve.
      # Incident 2026-07-24 — a docs reorg left dozens of dangling `docs/...` citations that no gate
      # saw (the only symptom was an unrelated gate crashing on ENOENT reading a moved spec). The
      # working desk (_meta/, .claude/) is excluded by design. Self-test proves the guard still catches
      # a seeded dangler.
      - name: Doc-link drift guard (+ self-test)
        run: |
          node scripts/check-doc-links.mjs
          node scripts/check-doc-links.mjs --self-test

      # Advisory only (never fails the build): nudges when user-facing changes have piled up
      # under the product tree since the last v* tag without a VERSION bump. The hard gate
      # (a documented CHANGELOG section for the tagged version) lives in release.yml.
      - name: Version-status advisory (non-blocking)
        run: node scripts/check-version-status.mjs

      # ---- repo-wide shell/workflow lint gates (mirror lefthook + `make check`, now enforced
      # server-side so a --no-verify push can't bypass them) ----

      # shellcheck: the shell entry points (public installer, the verify gate, the sandbox helpers,
      # the media recorder) were never linted in any workflow — a broken install.sh could ship. The
      # ubuntu-latest runner image ships shellcheck, so no install step is needed.
      - name: Shellcheck — shell entry points
        run: make shellcheck

      # actionlint: previously pre-commit / `make check` only, so a bypassed push escaped it. Built
      # with the Go toolchain already set up above (no new third-party action to pin and maintain).
      - name: Actionlint — workflow lint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint"

      # SHA-pin drift: every `uses:` must stay pinned to a full 40-hex commit SHA — nothing else
      # stops a later PR reintroducing a mutable @vN tag. Self-test proves the guard still bites.
      - name: Workflow SHA-pin drift guard (+ self-test)
        run: |
          node scripts/check-workflow-pins.mjs
          node scripts/check-workflow-pins.mjs --self-test

      # ---- Go lane ----
      - name: Go — build
        run: go build ./...

      - name: Go — vet
        run: go vet ./...

      # gofmt formatting gate: fail if any file in the module is not gofmt-clean. Uses the root
      # Makefile's `fmt` target (gofmt -l over the tree, fail-on-nonempty) so the gate logic
      # lives in one place; mirrors how `vet` above is a standing Go-lane check.
      - name: Go — gofmt (formatting gate)
        run: make fmt

      - name: Go — tests
        run: go test ./...

      - name: Go — verify gate (integration; self-init, write-boundary, restore, open-guard)
        run: make verify

      # ---- SPA lane ----
      # The browser gate runs HERE rather than only on a developer's machine. Two phases of UI
      # shipped on type-checks alone because the only verification was something someone had to
      # remember to run; a gate that is not wired in is not a gate.
      #
      # It stays inside this one job on purpose — the file's whole design is a single aggregate
      # check to mark required, and a second job would mean a second one.
      - name: SPA — install the browser driver
        run: |
          npm ci --prefix e2e/spa
          npx --prefix e2e/spa playwright install --with-deps chromium

      - name: SPA — browser gate (real Chromium over serve; asserts against the bytes on disk)
        run: make spa-verify
