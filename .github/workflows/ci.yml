name: ci

# The repo's build/graduation gate. One aggregate job (`ci`) runs both product lanes — the
# plugin (harness-pure core, MCP surface, schemas) and the librarian (Go binary) — plus the
# D8 identity-neutrality lint (M-05 surface iii), which fails the build on any hardcoded
# deployment identity. The single job name keeps one check to mark required at phase end.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: librarian/go.mod
          cache-dependency-path: librarian/go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      # ---- neutrality lint (D8) — runs first: fastest signal, no build needed ----
      - name: Neutrality lint — scan the shipped tree
        run: node scripts/check-neutrality.mjs

      - name: Neutrality lint — self-test (seeded-violation detection, AC5 down)
        run: node scripts/check-neutrality.mjs --self-test

      # ---- plugin lane ----
      - name: Install plugin deps
        working-directory: plugin
        run: bun install --frozen-lockfile

      - name: Plugin — core purity (AC2)
        working-directory: plugin
        run: bun run check:purity

      - name: Plugin — tests (incl. AC8 schema validation)
        working-directory: plugin
        run: bun run test

      - name: Plugin — TypeScript build
        working-directory: plugin
        run: bun run build

      # ---- librarian lane ----
      - name: Librarian — build
        working-directory: librarian
        run: go build ./...

      - name: Librarian — vet
        working-directory: librarian
        run: go vet ./...

      - name: Librarian — tests
        working-directory: librarian
        run: go test ./...
