name: ci

# The repo's build/graduation gate. One aggregate job (`ci`) runs both product lanes — the
# plugin (harness-pure core, MCP surface, schemas) and the librarian (Go binary) — plus the
# D8 identity-neutrality lint (M-05 surface iii), which fails the build on any hardcoded
# deployment identity. The single job name keeps one check to mark required at phase end.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0 # full history + tags so the version-status advisory can diff since the last release

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: librarian/go.mod
          cache-dependency-path: librarian/go.sum

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'

      # ---- neutrality lint (D8) — runs first: fastest signal, no build needed ----
      - name: Neutrality lint — scan the shipped tree
        run: node scripts/check-neutrality.mjs

      - name: Neutrality lint — self-test (seeded-violation detection, AC5 down)
        run: node scripts/check-neutrality.mjs --self-test

      # Version-sync: the root VERSION file is the single source of truth; fail if any of the
      # three shipped manifests (plugin.json, plugin/package.json, marketplace.json) drift.
      - name: Version-sync — VERSION vs shipped manifests
        run: node scripts/check-version-sync.mjs

      # Kit-manifest drift: the root kits.yaml must agree with the kits/ tree in both directions
      # (0013 S4(a); ported per #49). Fails naming any missing/untracked kit dir or file.
      - name: Kit-manifest drift guard — kits.yaml vs kits/ tree
        run: node scripts/check-kits.mjs

      # Prompt-copy drift: the librarian system-prompt embed and its "kept verbatim" quote in the
      # v1 spec must stay byte-identical (ADR 0015 — git is truth). Fails naming where they diverge.
      - name: Prompt-copy drift guard — embed vs spec quote
        run: node scripts/check-prompt-drift.mjs

      # Advisory only (never fails the build): nudges when user-facing changes have piled up
      # under plugin/ or librarian/ since the last v* tag without a VERSION bump. The hard gate
      # (a documented CHANGELOG section for the tagged version) lives in release.yml.
      - name: Version-status advisory (non-blocking)
        run: node scripts/check-version-status.mjs

      # ---- plugin lane ----
      - name: Install plugin deps
        working-directory: plugin
        run: bun install --frozen-lockfile

      - name: Plugin — core purity (AC2)
        working-directory: plugin
        run: bun run check:purity

      # Marketplace-distribution artifacts (claude-plugin/mcp/server.js + schema copy) are
      # generated by `bun run package` and committed so a marketplace install — which copies
      # ONLY plugin/claude-plugin/ to the plugin cache — carries a self-contained server. Fail
      # if the committed artifacts drift from a fresh regeneration (never hand-edit them).
      - name: Plugin — packaged artifacts drift guard
        working-directory: plugin
        run: |
          bun run package
          git diff --exit-code -- claude-plugin/

      - name: Plugin — tests (incl. AC8 schema validation)
        working-directory: plugin
        run: bun run test

      - name: Plugin — TypeScript build
        working-directory: plugin
        run: bun run build

      # ---- librarian lane ----
      - name: Librarian — build
        working-directory: librarian
        run: go build ./...

      - name: Librarian — vet
        working-directory: librarian
        run: go vet ./...

      - name: Librarian — tests
        working-directory: librarian
        run: go test ./...

      - name: Librarian — verify gate (integration; self-init, write-boundary, restore, open-guard)
        run: make verify
