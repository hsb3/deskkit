name: release

# Cuts a tagged release. Trigger: pushing a tag `v<major>.<minor>.<patch>`. The tag MUST match
# the root VERSION file (asserted in `gate`) — use `make release-prep` to run the gates and get
# the exact `git tag … && git push --tags` line. The workflow re-runs the CI gates, cross-
# compiles the deskkit binary for darwin/linux × amd64/arm64 (pure-Go, CGO disabled — PocketBase
# uses the modernc sqlite driver, so no cgo toolchain is needed), and publishes a GitHub release
# with the binaries and a sha256 checksums file.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---- gate: assert the tag matches VERSION, then re-run the CI gates inline ----
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Assert tag matches VERSION
        run: |
          version="$(cat VERSION)"
          expected="v${version}"
          if [ "${GITHUB_REF_NAME}" != "${expected}" ]; then
            echo "release: tag '${GITHUB_REF_NAME}' does not match VERSION ('${expected}')." >&2
            echo "Bump VERSION + the shipped manifests (see check-version-sync) and re-tag." >&2
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} matches VERSION ${version}."

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Neutrality lint — scan the shipped tree
        run: node scripts/check-neutrality.mjs

      - name: Neutrality lint — self-test
        run: node scripts/check-neutrality.mjs --self-test

      - name: Version-sync — VERSION vs shipped manifests
        run: node scripts/check-version-sync.mjs

      - name: Changelog — this version is documented
        run: node scripts/check-changelog.mjs

      # Mirror the branch-CI lint gates so the release gate stays a strict superset of CI's
      # blocking checks (a tag cut from a stale local main must not skip them).
      - name: Shellcheck — shell entry points
        run: make shellcheck

      - name: Actionlint — workflow lint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint"

      - name: Workflow SHA-pin drift guard (+ self-test)
        run: |
          node scripts/check-workflow-pins.mjs
          node scripts/check-workflow-pins.mjs --self-test

      - name: Go — build
        run: go build ./...

      - name: Go — vet
        run: go vet ./...

      - name: Go — tests
        run: go test ./...

      - name: Go — verify gate (integration; self-init, write-boundary, restore, open-guard)
        run: make verify

  # ---- cross-compile the librarian binary for every target ----
  binaries:
    needs: gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        goos: [darwin, linux]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Build SPA (go:embed source for internal/core/spa/dist)
        run: cd web && npm ci && npm run build

      - name: Cross-compile (CGO disabled, pure-Go)
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          version="$(cat VERSION)"
          out="deskkit_${version}_${{ matrix.goos }}_${{ matrix.goarch }}"
          go build -ldflags "-X main.version=${version}" -o "${out}" ./cmd/deskkit
          echo "built ${out}"

      - name: Upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deskkit_${{ matrix.goos }}_${{ matrix.goarch }}
          path: deskkit_*_${{ matrix.goos }}_${{ matrix.goarch }}
          if-no-files-found: error

  # ---- publish the GitHub release ----
  publish:
    needs: [binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          path: dist
          merge-multiple: true

      - name: Generate sha256 checksums
        run: |
          cd dist
          sha256sum ./* > ../checksums.txt
          mv ../checksums.txt .
          cat checksums.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(cat VERSION)"
          if [ -z "$(ls -A dist)" ]; then
            echo "dist/ is empty — refusing to create an artifact-less release" >&2
            exit 1
          fi
          gh release create "v${version}" dist/* \
            --title "v${version}" \
            --generate-notes
