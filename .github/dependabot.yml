# Dependency update policy — reactive-by-default.
#
# We do NOT open routine version-bump PRs (open-pull-requests-limit: 0). Dependabot
# SECURITY updates ignore that limit and still arrive as PRs — that's the "threat
# notice" trigger. The 7-day cooldown holds fresh releases back so a hijacked
# version gets yanked before Dependabot would ever propose it (mirrors the
# machine-level package-manager cooldowns). Raise a limit above 0 only for a
# deliberate catch-up.
#
# Template note: keep only the ecosystems this repo actually uses; point
# `directory` at the lockfile location (workspace roots use "/").
version: 2
updates:
  # CI is itself a supply-chain surface — keep actions current but delayed.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7

  # Node — delete if the repo has no JS/TS packages.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    cooldown:
      default-days: 7
    groups:
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"

  # Python (uv) — delete if the repo has no Python packages.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    cooldown:
      default-days: 7
    groups:
      uv-security:
        applies-to: security-updates
        patterns:
          - "*"
