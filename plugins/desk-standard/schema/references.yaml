# schema v1 — the reference dimension (companion to profile.schema.yaml and doctypes.yaml).
#
# WHAT THIS IS. The typed cross-reference primitive both lanes share: one shape for every
# reference-shaped value in the store (graduation targets, gate pointers, and future refs).
# A reference is { kind, target } — a closed `kind` enum plus a raw `target` string (the
# reference exactly as authored, with no format constraint). This is the contract ADR 0011
# ratifies (docs/decisions/0011-typed-reference-contract.md): it is specified now, and its
# field migrations ride the schema-v2 track — no field migrates onto the shape in this change.
#
# THE QUALIFIER IS NEVER PERSISTED. A bare reference (an issue number with no repo) is
# desk-relative: which issue "#N" means depends on the desk. Under the files-are-truth regime
# (ADR 0009) that repo qualifier resolves at READ time from the profile
# (profile.repos.shorthand.issue_default) and is NOT part of the stored { kind, target } shape.
# A future resolver consumes this rule; the persisted reference carries kind + target only.
# No default qualifier ships — identity-neutrality forbids one.
#
# STATUS OF CONSUMPTION. This is the CONTRACT as data plus a validation guard in each lane
# (librarian ReferenceVocab/ValidateReference; plugin validateReference). No extraction or
# resolution behaviour changes yet: today's graduation-marker extraction and pointer resolution
# are untouched — they become instances of this primitive later, on the schema-v2 track.

# The closed `kind` enum. Seeded with the two target-grammar forms the graduation marker
# already accepts: an issue-shaped ref (forms like "wb#N", "#N", or a bare number) and a raw
# URL. Broadening the set (a doc-pointer kind, a gate-selector kind) is a follow-up governed by
# ADR 0011, not this contract.
kind: [issue, url]

# The target slot: the reference exactly as authored. No format/enum constraint is imposed
# here — a target is validated only as non-empty; `kind` carries the type.
target:
  format: raw
  description: the reference exactly as authored; no format constraint
