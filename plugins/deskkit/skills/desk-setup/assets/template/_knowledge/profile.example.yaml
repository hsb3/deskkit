# _knowledge/profile.example.yaml — the personalization profile, ALL PLACEHOLDER VALUES.
# Copy to _knowledge/profile.yaml (or .json, or .md-with-frontmatter) and fill in.
# The system substitutes {{profile.<dotted.path>}} into prompts in place of hardcoded literals.
# This file ships in the repo; a real, populated profile does NOT (it is the consumer's).
# Holds identifiers and preferences only — NEVER credentials (those stay in env / a secrets
# store and are referenced indirectly via secrets_ref).
# Validates against schema/profile.schema.yaml (schema v1).
schema_version: 1

identity:
  name: "<display name>"
  github:
    personal: "<personal-github-handle>"
    work: "<work-github-handle>"
  email: "you@example.com"

repos:
  default: "owner/repo"
  by_role:
    product: "owner/repo-product"
    incubation: "owner/repo-incubation"
  shorthand:
    issue_default: "owner/repo"

board:
  provider: "github-projects"
  url: "https://example.com/board"
  number: 0

desk:
  name: "<desk name>"
  root: "."
  paths:
    decisions: "_structure/decisions"
    tasks: "tasks"
    analyses: "analyses"
    journal: "journal"
    secrets: "_meta/secrets"
    handoff: "_meta/HANDOFF.md"
    knowledge: "_knowledge"

machines:
  - name: "<hostname>"
    role: "primary"
    projects_root: "<repo-relative-or-~-relative-dir>"

# models / secrets_ref are COMMENTED OUT on purpose: both feed runtime config resolution, and
# the profile leg outranks every leg below it (store, central config, built-in default). A copied
# profile that still carries "<model-id>" would therefore win with a model id no provider knows,
# and "<ENV_VAR_NAME>" would make the missing-key error name an env var that does not exist.
# Left unset, each falls through to whatever the desk actually has configured. Uncomment and fill
# only the lines this deployment really pins.
# models:
#   provider: "anthropic"        # anthropic | openai | gemini
#   model: "<model-id>"
#   alternates: ["<model-id>", "<model-id>"]

# secrets_ref:
#   llm_api_key: "<ENV_VAR_NAME>"

preferences:
  commit_style: "<conventional | ...>"
  register: "<explanatory | terse | ...>"

# open-ended escape hatch for anything without a first-class key (0013 item 6 "other" type)
custom: {}
