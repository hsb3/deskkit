# _meta/mise-en-place.yml — per-repo variance manifest (tracked by default; ADR-0006).
# The standards define the invariants; this file is the ONLY home for per-repo variance.
# Field reference: the mise-en-place-scaffold skill's references/manifest.md.
# Readers: repo-compliance-audit + mise-en-place-scaffold consume default_branch,
# required_folders, required_files; the gh_* / board_title fields are declared here for
# the github-project-board skill. Unknown fields are tolerated by both readers.
owner: "hsb3"        # GitHub owner
repo: "desk-standard"
default_branch: main # e.g. dev in some orgs
gh_issue_labels: []  # [{name, color, description}] — consumed by github-project-board
gh_milestones: []    # [{title, description}] — consumed by github-project-board
board_title: ""
required_folders: [] # repo-specific additions beyond the standard
# Root tests/ ruling (2026-07-19, Lane 6 / issue #86 — decided, not deferred): this two-product
# repo co-locates tests with their source — Go suites in librarian/ (`go test ./...`), TS suites
# in plugin/ (`bun test`), plus the librarian/verify.sh integration gate; `make test` / `make
# verify` are the canonical entries. ROOT-10 is satisfied by a declared-home index at
# tests/README.md (directory existence is that row's pass condition), NOT by moving suites to the
# root. Do NOT add tests/ to required_folders: ROOT-10 already covers it, and a required_folders
# entry is auto-created as an empty .gitkeep dir by the scaffold, which would fight the authored
# README home. Broader 1.0.0 conformance (CLAUDE.md, AGENTS.md, docs/CHARTER.md) landed in the
# same Lane-6 pass; see docs/CHARTER.md and the design review off-repo.
# Root .mcp.json ruling (2026-07-22, "no dogfood"): this repo deliberately does not register
# its own MCP servers on itself — the standard's ROOT-07 row stays a GAP by design, not an
# oversight. The tools this repo builds coordinate desks other than the one that builds them; see
# CLAUDE.md's "No in-repo dogfooding" section. Do not add .mcp.json back or add it here to
# silence the row — there is no exclusion knob for a standard-required file, only additions.
required_files: []
