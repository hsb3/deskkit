# Pre-commit hooks that mirror CI's FAST gates so a violation surfaces before push. Install
# with `lefthook install` (folded into `make setup`). Deliberately fast: no go test / verify.sh
# here (those run in CI and via `make test` / `make verify`) — pre-commit stays under a couple
# seconds so it never tempts a `--no-verify`.
#
# The path-scoped hook (actionlint) only runs when its lane changed; the
# repo-wide gates (neutrality lint + self-test, version-sync) always run — they are cheap and
# a drift in any file can trip them.
pre-commit:
  parallel: true
  commands:
    neutrality:
      run: node scripts/check-neutrality.mjs
    neutrality-self-test:
      run: node scripts/check-neutrality.mjs --self-test
    version-sync:
      run: node scripts/check-version-sync.mjs
    actionlint:
      glob: ".github/**"
      run: actionlint
